<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유초등2부 말씀 퀴즈 - 주제를 찾아라!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Nanum Gothic', sans-serif, Arial;
    }
    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .quiz-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
      text-align: center;
      position: relative;
    }
    h1 {
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .step-buttons {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 25px;
    }
    .btn-step {
      flex: 1;
      padding: 10px 4px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: #ffffff;
      color: #3498db;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-step:hover:not(:disabled), .btn-step.active {
      background-color: #3498db;
      color: #ffffff;
    }
    .btn-step:disabled {
      border-color: #bdc3c7;
      background-color: #ecf0f1;
      color: #95a5a6;
      cursor: not-allowed;
    }
    .hint-box {
      background-color: #f9f9f9;
      border: 2px dashed #bdc3c7;
      border-radius: 15px;
      padding: 22px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .question-title {
      font-size: 20px;
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 14px;
    }
    .hint-content {
      font-size: 16px;
      color: #34495e;
      line-height: 1.6;
      word-break: keep-all;
    }
    .options-box {
      margin-top: 15px;
      padding: 12px;
      background: #edf2f7;
      border-radius: 10px;
      font-weight: bold;
      color: #2c3e50;
      width: 100%;
      font-size: 15px;
      word-break: keep-all;
    }
    
    /* 퍼즐 조각 모음 스타일 */
    .puzzle-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
    }
    .puzzle-piece {
      background: #ffeb3b;
      border: 2px solid #fbc02d;
      color: #2c3e50;
      font-size: 22px;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      animation: bounce 0.5s ease infinite alternate;
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    .answer-section {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .answer-input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
    }
    .answer-input:focus {
      border-color: #2ecc71;
    }
    .btn-submit {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #27ae60;
    }
    .result-message {
      font-size: 18px;
      font-weight: bold;
      min-height: 30px;
      word-break: keep-all;
    }
    .correct { color: #27ae60; }
    .wrong { color: #e74c3c; }

    /* 팝업 모달 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .modal-body {
      font-size: 20px;
      font-weight: bold;
      color: #27ae60;
      background: #e8f8f5;
      border: 2px dashed #2ecc71;
      padding: 20px;
      border-radius: 15px;
      line-height: 1.6;
      margin-bottom: 15px;
      word-break: keep-all;
    }
    .modal-word {
      font-size: 36px;
      color: #e67e22;
      display: block;
      margin-top: 10px;
    }
    .modal-timer {
      font-size: 15px;
      color: #7f8c8d;
      font-weight: bold;
    }

    /* final 성공 박스 스타일 */
    .final-success-box {
      background-color: #f3e5f5;
      border: 3px solid #8e44ad;
      border-radius: 15px;
      padding: 20px;
      color: #6c5ce7;
      font-size: 19px;
      font-weight: bold;
      line-height: 1.6;
      word-break: keep-all;
      animation: popIn 0.4s ease-out;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <h1>✨ 유초등2부 말씀 퀴즈 ✨</h1>
  
  <!-- 단계 버튼 -->
  <div class="step-buttons">
    <button id="btn1" class="btn-step active" onclick="showHint(1)">1단계</button>
    <button id="btn2" class="btn-step" onclick="showHint(2)" disabled>2단계 🔒</button>
    <button id="btn3" class="btn-step" onclick="showHint(3)" disabled>3단계 🔒</button>
    <button id="btn4" class="btn-step" onclick="showHint(4)" disabled>4단계 🔒</button>
  </div>

  <!-- 힌트 및 질문 영역 -->
  <div class="hint-box">
    <div id="question" class="question-title">1단계: 이 표현은 무엇일까요?</div>
    <div id="hint" class="hint-content">
      튼튼하게 서 있던 벽이나 건축물, 또는 제국이 견디지 못하고 아래로 힘없이 쓰러져 파괴되는 현상입니다. 
    </div>
    <div id="options" class="options-box" style="display: none;"></div>
    <div id="puzzleArea" class="puzzle-container" style="display: none;"></div>
  </div>

  <!-- 정답 입력 영역 -->
  <div id="answerSection" class="answer-section">
    <input type="text" id="answerInput" class="answer-input" placeholder="정답을 입력하세요" onkeyup="if(window.event.keyCode==13){checkAnswer()}">
    <button class="btn-submit" onclick="checkAnswer()">제출</button>
  </div>

  <!-- 결과 영역 -->
  <div id="result" class="result-message"></div>
</div>

<!-- 팝업 모달 레이어 -->
<div id="modalOverlay" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div id="modalTitle" class="modal-title">🎉 정답입니다!</div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalTimer" class="modal-timer">5초 후 다음 단계로 이동합니다...</div>
  </div>
</div>

<script>
  let currentStep = 1;
  let unlockedStep = 1;

  // 획득한 퍼즐 단어 저장
  const collectedWords = {
    1: "의",
    2: "비결",
    3: "승리"
  };

  const hints = {
    1: {
      question: "1단계: 이 현상을 무엇이라고 할까요?",
      text: "튼튼하게 서 있던 건물이나 성벽이 쓰러져 깨어지는 것을 말합니다. (OO하다 또는 OO)",
      options: "",
      answers: ["무너지다", "무너짐"]
    },
    2: {
      question: "2단계: 이곳은 어디일까요?",
      text: "요단강 서쪽에 위치한 지형으로, 종려나무의 성읍이라 불리는 아주 오래되고 강한 성벽을 가진 도시입니다. 이스라엘 백성이 하나님의 말씀대로 성을 돌았을 때 기적처럼 무너졌던 성읍입니다.",
      options: "보기: ① 예루살렘 &nbsp; ② 여리고 &nbsp; ③ 베들레헴 &nbsp; ④ 나자렛",
      answers: ["여리고", "2", "②", "2번"]
    },
    3: {
      question: "3단계: 이것은 무엇일까요?",
      text: "적이나 외침으로부터 안전하게 지키기 위해 돌이나 흙으로 높고 튼튼하게 쌓아 올린 커다란 건축물(영어로는 Castle)을 뜻하는 외글자 단어입니다.",
      options: "",
      answers: ["성"]
    },
    4: {
      question: "4단계: 퍼즐 단어를 모아 주제를 완성하세요!",
      text: "1~3단계에서 모은 단어 퍼즐 조각을 멋지게 조합해서 오늘 말씀의 최종 주제를 맞춰보세요!",
      options: "",
      answers: ["승리의비결", "승리의 비결"]
    }
  };

  function showHint(step) {
    if (step > unlockedStep) return;

    currentStep = step;
    
    // 버튼 스타일 설정
    for (let i = 1; i <= 4; i++) {
      const btn = document.getElementById(`btn${i}`);
      if (i === step) btn.classList.add('active');
      else btn.classList.remove('active');
    }

    document.getElementById('question').innerText = hints[step].question;
    document.getElementById('hint').innerText = hints[step].text;
    
    // 보기 영역 처리
    const optionsDiv = document.getElementById('options');
    if (hints[step].options) {
      optionsDiv.innerHTML = hints[step].options;
      optionsDiv.style.display = "block";
    } else {
      optionsDiv.style.display = "none";
    }

    // 4단계 퍼즐 조각 보여주기 처리
    const puzzleArea = document.getElementById('puzzleArea');
    if (step === 4) {
      puzzleArea.innerHTML = `
        <div class="puzzle-piece">🧩 의</div>
        <div class="puzzle-piece">🧩 비결</div>
        <div class="puzzle-piece">🧩 승리</div>
      `;
      puzzleArea.style.display = "flex";
    } else {
      puzzleArea.style.display = "none";
    }

    document.getElementById('answerSection').style.display = "flex";
    document.getElementById('answerInput').value = "";
    document.getElementById('result').innerText = "";
  }

  function checkAnswer() {
    const userInput = document.getElementById('answerInput').value.trim().replace(/\s+/g, '');
    const resultDiv = document.getElementById('result');

    if (!userInput) {
      resultDiv.innerText = "정답을 입력해주세요!";
      resultDiv.className = "result-message wrong";
      return;
    }

    const validAnswers = hints[currentStep].answers.map(a => a.replace(/\s+/g, ''));
    const isCorrect = validAnswers.includes(userInput);

    if (isCorrect) {
      // 4단계 최종 정답 처리
      if (currentStep === 4) {
        document.getElementById('answerSection').style.display = "none";
        resultDiv.innerHTML = `
          <div class="final-success-box">
            🎉 와우! 정답이에요! <br><br>
            🤫 <strong>목장에서 가장 큰 형 또는 언니가 얼른 사회자 선생님에게 귓속말로 알려주세요!</strong>
          </div>
        `;
        return;
      }

      resultDiv.innerText = "";

      // 다음 단계 해금
      if (currentStep === unlockedStep && unlockedStep < 4) {
        unlockedStep++;
        const nextBtn = document.getElementById(`btn${unlockedStep}`);
        nextBtn.disabled = false;
        if (unlockedStep === 4) {
          nextBtn.innerText = "4단계 (최종)";
        } else {
          nextBtn.innerText = `${unlockedStep}단계`;
        }
      }

      // 단어 퍼즐 획득 팝업 실행
      openRewardModal(currentStep);

    } else {
      resultDiv.innerText = "❌ 아쉽네요. 다시 생각해보세요!";
      resultDiv.className = "result-message wrong";
    }
  }

  // 단어 퍼즐 획득 팝업 모달
  function openRewardModal(step) {
    const modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalTimer = document.getElementById('modalTimer');

    const word = collectedWords[step];

    modalTitle.innerText = `🎉 ${step}단계 정답입니다!`;
    modalBody.innerHTML = `
      🧩 퍼즐 조각을 획득했습니다!
      <span class="modal-word"> 단어: "${word}" </span>
    `;

    modal.style.display = "flex";

    let timeLeft = 5;
    modalTimer.innerText = `${timeLeft}초 후 다음 단계로 이동합니다...`;

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        modalTimer.innerText = `${timeLeft}초 후 다음 단계로 이동합니다...`;
      } else {
        clearInterval(timer);
        modal.style.display = "none";
        showHint(unlockedStep); // 다음 단계 문제 화면으로 자동 이동
      }
    }, 1000);
  }
</script>

</body>
</html>
