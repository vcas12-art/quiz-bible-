<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유초등2부 말씀 퀴즈 - 진짜 승리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e0e7ff 100%);
      touch-action: manipulation;
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .quiz-card {
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .animate-float {
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .letter-btn {
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #93c5fd;
    }
    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #93c5fd;
    }
    /* Touch & Drag Puzzle Styling */
    .puzzle-piece {
      user-select: none;
      touch-action: none;
      cursor: grab;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .puzzle-piece:active {
      cursor: grabbing;
      transform: scale(1.05);
      z-index: 30;
    }
    .slot-zone {
      min-height: 56px;
      transition: all 0.2s ease;
    }
    .slot-zone.drag-over {
      background-color: #fef08a;
      border-color: #eab308;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="quiz-card bg-white w-full max-w-lg rounded-3xl p-6 md:p-8 border-4 border-blue-100 relative overflow-hidden">
  
  <!-- Header Title -->
  <div class="text-center mb-6">
    <span class="inline-block bg-blue-100 text-blue-700 font-bold px-4 py-1 rounded-full text-sm mb-2 font-jua">
      ✨ 유초등2부 말씀 퀴즈 ✨
    </span>
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 font-jua">
      🧩 퍼즐을 모아라!
    </h1>
  </div>

  <!-- Step Progress Buttons -->
  <div class="flex justify-between gap-2 mb-6">
    <button id="btn1" class="btn-step flex-1 py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-blue-400 bg-blue-500 text-white transition-all shadow-sm" onclick="showStep(1)">1단계</button>
    <button id="btn2" class="btn-step flex-1 py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(2)" disabled>2단계 🔒</button>
    <button id="btn3" class="btn-step flex-1 py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(3)" disabled>3단계 🔒</button>
  </div>

  <!-- Question Box -->
  <div class="bg-amber-50/70 border-2 border-dashed border-amber-300 rounded-2xl p-5 mb-5 min-h-[170px] flex flex-col justify-center items-center text-center">
    <div id="questionTitle" class="text-lg md:text-xl font-bold text-amber-800 font-jua mb-2">
      1단계: 이것은 어떤 현상일까요?
    </div>
    <div id="questionHint" class="text-sm md:text-base text-gray-700 leading-relaxed font-medium">
      <!-- Dynamic Hint Content -->
    </div>

    <!-- Step 1 Multiple Choice Options (4지 선다) -->
    <div id="step1Options" class="w-full mt-3 grid grid-cols-2 gap-2 max-w-[320px] mx-auto">
      <!-- Generated by JS -->
    </div>

    <!-- Step 2 & 3 Interactive Letter Grid -->
    <div id="letterGridArea" class="hidden w-full mt-4">
      <p class="text-xs text-blue-600 font-bold mb-2">👇 아래 글자를 눌러서 정답을 만들어보세요!</p>
      <div id="letterGrid" class="grid grid-cols-3 gap-2 max-w-[280px] mx-auto">
        <!-- Generated by JS -->
      </div>
      <button id="btnClearInput" onclick="clearLetterInput()" class="mt-2 text-xs text-gray-500 underline hover:text-red-500">지우기</button>
    </div>
  </div>

  <!-- Answer Input Section -->
  <div id="answerSection" class="flex gap-2 mb-4">
    <input type="text" id="answerInput" class="flex-1 px-4 py-3 text-base border-2 border-gray-300 rounded-xl outline-none focus:border-blue-500 transition-all font-bold text-center text-gray-800" placeholder="정답 입력" onkeyup="if(event.key==='Enter'){checkAnswer()}">
    <button onclick="checkAnswer()" class="bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold px-5 py-3 rounded-xl transition-all shadow-md font-jua">
      제출
    </button>
  </div>

  <!-- Result Message -->
  <div id="resultMsg" class="min-h-[28px] text-center font-bold text-base"></div>
</div>

<!-- Modal Popup for reward -->
<div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
  <div class="modal-pop bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-300">
    <div id="modalTitle" class="text-xl font-bold text-gray-800 font-jua mb-2">🎉 정답입니다!</div>
    
    <div class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-5 my-4">
      <span class="text-sm font-bold text-amber-800 block mb-1">🧩 획득한 단어 퍼즐 조각</span>
      <span id="modalWord" class="text-4xl font-bold text-blue-600 font-jua block py-2">진짜</span>
    </div>

    <div id="modalTimer" class="text-xs text-gray-500 font-bold">
      ⏱️ <span id="timerCount" class="text-red-500 font-bold">5</span>초 후 다음 단계로 이동합니다...
    </div>
  </div>
</div>

<!-- JavaScript Application Logic -->
<script>
  let currentStep = 1;
  let unlockedStep = 1;

  // Words awarded for each step
  const rewardWords = {
    1: "진짜",
    2: "승리"
  };

  // Step information
  const stepData = {
    1: {
      title: "1단계: 이것은 어떤 현상일까요?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(4지 선다)</span><br>하나로 붙어 있거나 막혀 있던 바다, 땅, 물건 따위가 두 갈래 이상으로 벌어져 쪼개지는 현상입니다.`,
      answers: ["갈라짐", "갈라지다", "1", "①", "1번"],
      type: "mcq",
      options: ["① 갈라짐", "② 합쳐짐", "③ 솟아남", "④ 뒤덮임"]
    },
    2: {
      title: "2단계: 이곳은 어떤 바다일까요?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(글자 선택)</span><br>하나님께서 모세를 통해 지팡이를 들게 하셨을 때, 바다가 갈라져 이스라엘 백성이 마른 땅처럼 건넜던 기적의 바다입니다.`,
      answers: ["홍해"],
      type: "grid",
      letters: ["홍", "해", "갈", "라", "지", "다", "성", "벽", "강"]
    },
    3: {
      title: "3단계: 모은 단어로 주제를 완성하세요!",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(글자 선택)</span><br>1단계와 2단계에서 얻은 힌트를 바탕으로 주제를 만들어 보세요.(4글자)`,
      answers: ["진짜승리", "진짜 승리"],
      type: "grid",
      letters: ["진", "짜", "승", "리", "가", "패", "배", "평", "화"]
    }
  };

  // Shuffle helper
  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function renderStep1Options() {
    const container = document.getElementById("step1Options");
    container.innerHTML = "";
    stepData[1].options.forEach((optText) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-900 font-bold text-sm md:text-base py-2.5 px-2 rounded-xl font-jua transition-all";
      btn.innerText = optText;
      btn.onclick = () => {
        const cleanVal = optText.replace(/^[①②③④]\s*/, "");
        document.getElementById("answerInput").value = cleanVal;
      };
      container.appendChild(btn);
    });
  }

  function renderLetterGrid(letters) {
    const gridContainer = document.getElementById("letterGrid");
    gridContainer.innerHTML = "";
    
    const shuffled = shuffleArray(letters);
    shuffled.forEach((char) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn bg-blue-100 hover:bg-blue-200 border-2 border-blue-300 text-blue-900 font-bold text-lg py-2 rounded-xl font-jua";
      btn.innerText = char;
      btn.onclick = () => appendLetter(char);
      gridContainer.appendChild(btn);
    });
  }

  function appendLetter(char) {
    const input = document.getElementById("answerInput");
    if (input) input.value += char;
  }

  function clearLetterInput() {
    const input = document.getElementById("answerInput");
    if (input) input.value = "";
  }

  // Window global attachments
  window.appendLetter = appendLetter;
  window.clearLetterInput = clearLetterInput;
  window.showStep = showStep;
  window.checkAnswer = checkAnswer;

  function showStep(step) {
    if (step > unlockedStep) return;

    currentStep = step;
    
    // Update step button visual state
    for (let i = 1; i <= 3; i++) {
      const btn = document.getElementById(`btn${i}`);
      if (i === step) {
        btn.className = "btn-step flex-1 py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-blue-500 bg-blue-500 text-white shadow-md transition-all";
      } else if (i <= unlockedStep) {
        btn.className = "btn-step flex-1 py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-blue-400 bg-white text-blue-500 hover:bg-blue-50 transition-all";
      }
    }

    const data = stepData[step];
    document.getElementById("questionTitle").innerText = data.title;
    document.getElementById("questionHint").innerHTML = data.hintHtml;

    const step1Options = document.getElementById("step1Options");
    const gridArea = document.getElementById("letterGridArea");
    const answerSection = document.getElementById("answerSection");

    answerSection.classList.remove("hidden");

    if (data.type === "mcq") {
      step1Options.classList.remove("hidden");
      gridArea.classList.add("hidden");
      renderStep1Options();
    } else if (data.type === "grid") {
      step1Options.classList.add("hidden");
      gridArea.classList.remove("hidden");
      renderLetterGrid(data.letters);
    }

    document.getElementById("answerInput").value = "";
    document.getElementById("resultMsg").innerText = "";
  }

  // Answer verification
  function checkAnswer() {
    const inputVal = document.getElementById("answerInput").value.trim().replace(/\s+/g, '');
    const resultMsg = document.getElementById("resultMsg");

    if (!inputVal) {
      resultMsg.innerText = "정답을 선택하거나 입력해주세요!";
      resultMsg.className = "min-h-[28px] text-center font-bold text-base text-red-500";
      return;
    }

    const validAnswers = stepData[currentStep].answers.map(a => a.replace(/\s+/g, ''));
    const isCorrect = validAnswers.includes(inputVal);

    if (isCorrect) {
      resultMsg.innerText = "";

      if (currentStep === 3) {
        // Step 3 Final Success Message
        document.getElementById("answerSection").classList.add("hidden");
        document.getElementById("letterGridArea").classList.add("hidden");
        
        resultMsg.innerHTML = `
          <div class="bg-purple-100 border-2 border-purple-400 rounded-2xl p-5 text-purple-900 font-bold text-base leading-relaxed modal-pop shadow-md">
            🎉 정답입니다! <br><br>
            🤫 <span class="text-purple-700 text-lg">목장에서 가장 어린 목원이 사회자에게 귓속말로 정답을 알려주세요!</span>
          </div>
        `;
        return;
      }

      // Unlock next step
      if (currentStep === unlockedStep && unlockedStep < 3) {
        unlockedStep++;
        const nextBtn = document.getElementById(`btn${unlockedStep}`);
        nextBtn.disabled = false;
        nextBtn.innerText = `${unlockedStep}단계`;
      }

      // Show reward popup
      openRewardModal(currentStep);
    } else {
      resultMsg.innerText = "❌ 아쉽네요. 다시 생각해보세요!";
      resultMsg.className = "min-h-[28px] text-center font-bold text-base text-red-500";
    }
  }

  function openRewardModal(step) {
    const overlay = document.getElementById("modalOverlay");
    const wordSpan = document.getElementById("modalWord");
    const timerCount = document.getElementById("timerCount");

    wordSpan.innerText = `"${rewardWords[step]}"`;
    overlay.classList.remove("hidden");
    overlay.classList.add("flex");

    let count = 5;
    timerCount.innerText = count;

    const timerInterval = setInterval(() => {
      count--;
      if (count > 0) {
        timerCount.innerText = count;
      } else {
        clearInterval(timerInterval);
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
        showStep(unlockedStep); // Move to next step automatically
      }
    }, 1000);
  }

  window.onload = function() {
    const clearBtn = document.getElementById("btnClearInput");
    if (clearBtn) {
      clearBtn.addEventListener("click", clearLetterInput);
    }
    showStep(1);
  };
</script>

</body>
</html>
