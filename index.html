<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유초등2부 말씀 퀴즈 - 십자가 사랑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: linear-gradient(135deg, #fef3c7 0%, #f0fdf4 50%, #eff6ff 100%);
      touch-action: manipulation;
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .quiz-card {
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .letter-btn {
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #93c5fd;
    }
    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #93c5fd;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="quiz-card bg-white w-full max-w-lg rounded-3xl p-6 md:p-8 border-4 border-rose-100 relative overflow-hidden">
  
  <!-- Header Title -->
  <div class="text-center mb-5">
    <span class="inline-block bg-rose-100 text-rose-800 font-bold px-4 py-1.5 rounded-full text-xs md:text-sm mb-1 font-jua">
      🌱 유초등2부 말씀 퀴즈 🌱
    </span>
  </div>

  <!-- Step Progress Buttons -->
  <div class="grid grid-cols-4 gap-1.5 md:gap-2 mb-5">
    <button id="btn1" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-rose-400 bg-rose-500 text-white transition-all shadow-sm" onclick="showStep(1)">1단계</button>
    <button id="btn2" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(2)" disabled>2단계 🔒</button>
    <button id="btn3" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(3)" disabled>3단계 🔒</button>
    <button id="btn4" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(4)" disabled>4단계 🔒</button>
  </div>

  <!-- Main Bible Verse Banner -->
  <div class="bg-rose-50 border-2 border-rose-200 rounded-2xl p-3 mb-4 text-center">
    <p class="text-xs md:text-sm font-bold text-rose-900 leading-relaxed">
      📖 <span class="underline decoration-amber-400 decoration-2">"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라"</span>
      <span class="block text-xs text-rose-600 font-normal mt-0.5">(로마서 5장 8절)</span>
    </p>
  </div>

  <!-- Question Box -->
  <div class="bg-amber-50/80 border-2 border-dashed border-amber-300 rounded-2xl p-4 md:p-5 mb-5 min-h-[190px] flex flex-col justify-center items-center text-center">
    <div id="questionTitle" class="text-base md:text-lg font-bold text-amber-900 font-jua mb-2">
      <!-- Dynamic Question Title -->
    </div>
    <div id="questionHint" class="text-xs md:text-sm text-gray-700 leading-relaxed font-medium">
      <!-- Dynamic Hint Content -->
    </div>

    <!-- Unlocked Hint Card for step 4 -->
    <div id="unlockedHintCard" class="hidden w-full mt-3 p-3 bg-amber-100 border-2 border-amber-400 rounded-xl text-amber-900 font-bold text-xs md:text-sm">
      <!-- Dynamic Step Hint -->
    </div>

    <!-- MCQ Options Area -->
    <div id="mcqOptionsArea" class="w-full mt-3 grid grid-cols-2 gap-2 max-w-[340px] mx-auto">
      <!-- Generated by JS -->
    </div>

    <!-- Interactive Letter Grid Area -->
    <div id="letterGridArea" class="hidden w-full mt-3">
      <p id="gridInstruction" class="text-xs text-blue-600 font-bold mb-2">👇 아래 보기 단어/글자를 클릭해보세요!</p>
      <div id="letterGrid" class="flex flex-wrap justify-center gap-2 max-w-[340px] mx-auto">
        <!-- Generated by JS -->
      </div>
      <button id="btnClearInput" class="mt-2.5 text-xs text-gray-500 underline hover:text-red-500 font-bold">지우기</button>
    </div>
  </div>

  <!-- Answer Input Section -->
  <div id="answerSection" class="flex flex-col items-center gap-3 mb-4 w-full">
    <input type="text" id="answerInput" class="w-full px-4 py-3 text-base border-2 border-gray-300 rounded-xl outline-none focus:border-rose-500 transition-all font-bold text-center text-gray-800 shadow-inner" placeholder="정답 입력 또는 보기 선택" onkeyup="if(event.key==='Enter'){checkAnswer()}">
    <button onclick="checkAnswer()" class="w-full py-3.5 px-6 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-bold text-lg rounded-xl transition-all shadow-md font-jua text-center flex items-center justify-center gap-2">
      <span>제출하기</span>
      <span>➔</span>
    </button>
  </div>

  <!-- Result Message -->
  <div id="resultMsg" class="min-h-[28px] text-center font-bold text-sm md:text-base"></div>
</div>

<!-- Modal Popup for Reward / Step Transition -->
<div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
  <div class="modal-pop bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-300">
    <div id="modalTitle" class="text-xl font-bold text-gray-800 font-jua mb-2">🎉 정답입니다!</div>
    
    <div id="modalContentBox" class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-4 my-3 text-sm font-bold text-amber-900 leading-relaxed">
      <!-- Dynamic Content -->
    </div>

    <div id="modalTimer" class="text-xs text-gray-500 font-bold">
      ⏱️ <span id="timerCount" class="text-red-500 font-bold">3</span>초 후 다음 단계로 이동합니다...
    </div>
  </div>
</div>

<script>
  let currentStep = 1;
  let unlockedStep = 1;

  // Words earned per step
  let stepWordsEarned = {
    1: "사랑",
    2: "십자가",
    3: "예수님"
  };

  const stepData = {
    1: {
      title: "1단계: 하나님이 우리에게 보여주신 가장 큰 마음은?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(4지 선다)</span><br>하나님이 외아들 예수님을 이 땅에 보내주실 만큼 우리에게 베풀어주신 마음은 무엇일까요?`,
      answers: ["사랑", "1", "①", "1번"],
      type: "mcq",
      options: ["① 사랑", "② 미움", "③ 분노", "④ 질투"]
    },
    2: {
      title: "2단계: 예수님이 우리 죄를 대신해 지신 이것은?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(글자 선택)</span><br>우리의 죄를 용서하기 위해 예수님이 피 흘려 구원을 완성하신 나무 틀은 무엇일까요?`,
      answers: ["십자가"],
      type: "grid",
      letters: ["십", "자", "가", "면", "류", "관", "무", "덤", "돌", "판", "성", "전"]
    },
    3: {
      title: "3단계: 우리를 위해 십자가에서 죽으시고 부활하신 분은?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(글자 선택)</span><br>온 세상을 구원하신 우리의 유일한 구원자는 누구이신가요?`,
      answers: ["예수님"],
      type: "grid",
      letters: ["예", "수", "님", "베", "드", "로", "바", "울", "요", "한", "모", "세"]
    },
    4: {
      title: "4단계 (최종): 1~3단계 낱말을 조합해보세요!",
      hintHtml: `<span class="inline-block bg-rose-200 text-rose-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">✨ 최종 주제 맞추기</span><br>각 단계에서 맞춘 낱말들을 조합하여 멋진 문장을 완성해보세요!`,
      answers: ["예수님의십자가사랑", "예수님의 십자가 사랑", "예수님 십자가 사랑"],
      type: "grid",
      letters: ["예수님", "의", "십자가", "사랑", "은혜", "구원", "믿음"]
    }
  };

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function renderMCQOptions(options) {
    const container = document.getElementById("mcqOptionsArea");
    container.innerHTML = "";
    options.forEach((optText) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-900 font-bold text-sm md:text-base py-2.5 px-2 rounded-xl font-jua transition-all";
      btn.innerText = optText;
      btn.onclick = () => {
        const cleanVal = optText.replace(/^[①②③④]\s*/, "");
        document.getElementById("answerInput").value = cleanVal;
      };
      container.appendChild(btn);
    });
  }

  function renderLetterGrid(letters) {
    const gridContainer = document.getElementById("letterGrid");
    gridContainer.innerHTML = "";
    
    letters.forEach((item) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn bg-rose-100 hover:bg-rose-200 border-2 border-rose-300 text-rose-900 font-bold text-base md:text-lg py-2 px-3 rounded-xl font-jua";
      btn.innerText = item;
      btn.onclick = () => appendLetter(item);
      gridContainer.appendChild(btn);
    });
  }

  function appendLetter(text) {
    const input = document.getElementById("answerInput");
    if (input) {
      if (input.value.length > 0 && !input.value.endsWith(" ")) {
        // Automatically add space if clicking phrase chunks in step 4
        input.value += (currentStep === 4 ? " " : "") + text;
      } else {
        input.value += text;
      }
    }
  }

  function clearLetterInput() {
    const input = document.getElementById("answerInput");
    if (input) input.value = "";
  }

  window.appendLetter = appendLetter;
  window.clearLetterInput = clearLetterInput;
  window.showStep = showStep;
  window.checkAnswer = checkAnswer;

  function showStep(step) {
    if (step > unlockedStep) return;

    currentStep = step;
    
    for (let i = 1; i <= 4; i++) {
      const btn = document.getElementById(`btn${i}`);
      if (i === step) {
        btn.className = "btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-rose-500 bg-rose-500 text-white shadow-md transition-all";
      } else if (i <= unlockedStep) {
        btn.className = "btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-rose-400 bg-white text-rose-600 hover:bg-rose-50 transition-all";
      }
    }

    const data = stepData[step];
    document.getElementById("questionTitle").innerText = data.title;
    document.getElementById("questionHint").innerHTML = data.hintHtml;

    const mcqArea = document.getElementById("mcqOptionsArea");
    const gridArea = document.getElementById("letterGridArea");
    const answerSection = document.getElementById("answerSection");
    const unlockedHintCard = document.getElementById("unlockedHintCard");

    answerSection.classList.remove("hidden");

    if (step === 4) {
      unlockedHintCard.innerHTML = `🎁 1~3단계에서 얻은 낱말들을 조합하여 최종 정답 문장을 완성해보세요!`;
      unlockedHintCard.classList.remove("hidden");
    } else {
      unlockedHintCard.classList.add("hidden");
    }

    if (data.type === "mcq") {
      mcqArea.classList.remove("hidden");
      gridArea.classList.add("hidden");
      renderMCQOptions(data.options);
    } else if (data.type === "grid") {
      mcqArea.classList.add("hidden");
      gridArea.classList.remove("hidden");
      renderLetterGrid(shuffleArray(data.letters));
    }

    document.getElementById("answerInput").value = "";
    document.getElementById("resultMsg").innerText = "";
  }

  function checkAnswer() {
    const rawVal = document.getElementById("answerInput").value.trim();
    const inputVal = rawVal.replace(/\s+/g, '');
    const resultMsg = document.getElementById("resultMsg");

    if (!inputVal) {
      resultMsg.innerText = "정답을 선택하거나 입력해주세요!";
      resultMsg.className = "min-h-[28px] text-center font-bold text-xs md:text-base text-red-500";
      return;
    }

    const validAnswers = stepData[currentStep].answers.map(a => a.replace(/\s+/g, ''));
    const isCorrect = validAnswers.includes(inputVal);

    if (isCorrect) {
      resultMsg.innerText = "";

      if (currentStep === 4) {
        document.getElementById("answerSection").classList.add("hidden");
        document.getElementById("letterGridArea").classList.add("hidden");
        document.getElementById("mcqOptionsArea").classList.add("hidden");
        
        resultMsg.innerHTML = `
          <div class="bg-rose-100 border-2 border-rose-400 rounded-2xl p-5 text-rose-950 font-bold text-base leading-relaxed modal-pop shadow-md text-center">
            🎉 정답입니다! (예수님의 십자가 사랑) <br><br>
            🤫 <span class="text-purple-800 text-base md:text-lg block mt-1">목장에서 가장 어린 목원이 사회자에게 귓속말로 정답을 알려주세요!</span>
          </div>
        `;
        return;
      }

      if (currentStep === unlockedStep && unlockedStep < 4) {
        unlockedStep++;
        const nextBtn = document.getElementById(`btn${unlockedStep}`);
        nextBtn.disabled = false;
        if (unlockedStep === 4) {
          nextBtn.innerText = "4단계 (최종)";
        } else {
          nextBtn.innerText = `${unlockedStep}단계`;
        }
      }

      openRewardModal(currentStep);
    } else {
      resultMsg.innerText = "❌ 아쉽네요. 다시 생각해보세요!";
      resultMsg.className = "min-h-[28px] text-center font-bold text-xs md:text-base text-red-500";
    }
  }

  function openRewardModal(step) {
    const overlay = document.getElementById("modalOverlay");
    const contentBox = document.getElementById("modalContentBox");
    const timerCount = document.getElementById("timerCount");
    const modalTitle = document.getElementById("modalTitle");

    if (step === 1) {
      modalTitle.innerText = "🎉 1단계 통과!";
      contentBox.innerHTML = `첫 번째 힌트 낱말 획득: <span class="text-rose-600 font-extrabold text-xl">'${stepWordsEarned[1]}'</span>`;
    } else if (step === 2) {
      modalTitle.innerText = "🎉 2단계 정답!";
      contentBox.innerHTML = `두 번째 힌트 낱말 획득: <span class="text-rose-600 font-extrabold text-xl">'${stepWordsEarned[2]}'</span>`;
    } else if (step === 3) {
      modalTitle.innerText = "🎉 3단계 성공!";
      contentBox.innerHTML = `세 번째 힌트 낱말 획득: <span class="text-rose-600 font-extrabold text-xl">'${stepWordsEarned[3]}'</span><br><br>🔓 최종 4단계가 해금되었습니다!`;
    }

    overlay.classList.remove("hidden");
    overlay.classList.add("flex");

    let count = 3;
    timerCount.innerText = count;

    const timerInterval = setInterval(() => {
      count--;
      if (count > 0) {
        timerCount.innerText = count;
      } else {
        clearInterval(timerInterval);
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
        showStep(unlockedStep);
      }
    }, 1000);
  }

  window.onload = function() {
    const clearBtn = document.getElementById("btnClearInput");
    if (clearBtn) {
      clearBtn.addEventListener("click", clearLetterInput);
    }
    showStep(1);
  };
</script>

</body>
</html>
