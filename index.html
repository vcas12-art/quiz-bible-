<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유초등2부 말씀 퀴즈 - 하나님의 마음 '긍휼'</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Gowun Dodum', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fef3c7 100%);
      touch-action: manipulation;
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    .quiz-card {
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .letter-btn {
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #93c5fd;
    }
    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #93c5fd;
    }
    .letter-btn-final {
      transition: all 0.2s ease;
      box-shadow: 0 4px 0 #fcd34d;
    }
    .letter-btn-final:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #fcd34d;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="quiz-card bg-white w-full max-w-lg rounded-3xl p-6 md:p-8 border-4 border-blue-100 relative overflow-hidden">
  
  <!-- Header Title -->
  <div class="text-center mb-5">
    <span class="inline-block bg-amber-100 text-amber-800 font-bold px-4 py-1 rounded-full text-xs md:text-sm mb-2 font-jua">
      ✨ 유초등2부 말씀 퀴즈 ✨
    </span>
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 font-jua">
      🐑 하나님의 마음을 맞춰라!
    </h1>
  </div>

  <!-- Step Progress Buttons -->
  <div class="grid grid-cols-4 gap-1.5 md:gap-2 mb-5">
    <button id="btn1" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-blue-400 bg-blue-500 text-white transition-all shadow-sm" onclick="showStep(1)">1단계</button>
    <button id="btn2" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(2)" disabled>2단계 🔒</button>
    <button id="btn3" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(3)" disabled>3단계 🔒</button>
    <button id="btn4" class="btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-gray-200 bg-gray-100 text-gray-400 cursor-not-allowed transition-all" onclick="showStep(4)" disabled>4단계 🔒</button>
  </div>

  <!-- Main Bible Verse Banner -->
  <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-3 mb-4 text-center">
    <p class="text-xs md:text-sm font-bold text-blue-900 leading-relaxed">
      📖 <span class="underline decoration-amber-400 decoration-2">"죄인 한 사람이 회개하면 하늘에서는 회개할 것 없는 의인 아흔아홉으로 말미암아 기뻐하는 것보다 더하리라"</span>
      <span class="block text-xs text-blue-600 font-normal mt-0.5">(누가복음 15장 7절)</span>
    </p>
  </div>

  <!-- Question Box -->
  <div class="bg-amber-50/80 border-2 border-dashed border-amber-300 rounded-2xl p-4 md:p-5 mb-5 min-h-[180px] flex flex-col justify-center items-center text-center">
    <div id="questionTitle" class="text-base md:text-lg font-bold text-amber-900 font-jua mb-2">
      1단계: 이것은 무엇일까요?
    </div>
    <div id="questionHint" class="text-xs md:text-sm text-gray-700 leading-relaxed font-medium">
      <!-- Dynamic Hint Content -->
    </div>

    <!-- Step 2 Hint Card Unlocked in Step 3 -->
    <div id="unlockedHintCard" class="hidden w-full mt-3 p-3 bg-amber-100 border-2 border-amber-400 rounded-xl text-amber-900 font-bold text-xs md:text-sm">
      <!-- Dynamic Step 2 Hint -->
    </div>

    <!-- Step 1 & 3 Multiple Choice Options -->
    <div id="mcqOptionsArea" class="w-full mt-3 grid grid-cols-2 gap-2 max-w-[340px] mx-auto">
      <!-- Generated by JS -->
    </div>

    <!-- Step 2 & 4 Interactive Letter Grid -->
    <div id="letterGridArea" class="hidden w-full mt-3">
      <p id="gridInstruction" class="text-xs text-blue-600 font-bold mb-2">👇 글자를 클릭하여 정답을 만들어보세요!</p>
      <div id="letterGrid" class="grid grid-cols-4 gap-2 max-w-[320px] mx-auto">
        <!-- Generated by JS -->
      </div>
      <button id="btnClearInput" onclick="clearLetterInput()" class="mt-2.5 text-xs text-gray-500 underline hover:text-red-500 font-bold">지우기</button>
    </div>
  </div>

  <!-- Answer Input Section (스마트폰 최적화: 입력창 아래 중앙 제출 버튼) -->
  <div id="answerSection" class="flex flex-col items-center gap-3 mb-4 w-full">
    <input type="text" id="answerInput" class="w-full px-4 py-3 text-base border-2 border-gray-300 rounded-xl outline-none focus:border-blue-500 transition-all font-bold text-center text-gray-800 shadow-inner" placeholder="정답 입력" onkeyup="if(event.key==='Enter'){checkAnswer()}">
    <button onclick="checkAnswer()" class="w-full py-3.5 px-6 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold text-lg rounded-xl transition-all shadow-md font-jua text-center flex items-center justify-center gap-2">
      <span>제출하기</span>
      <span>➔</span>
    </button>
  </div>

  <!-- Result Message -->
  <div id="resultMsg" class="min-h-[28px] text-center font-bold text-sm md:text-base"></div>
</div>

<!-- Modal Popup for Reward / Step Transition -->
<div id="modalOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
  <div class="modal-pop bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-300">
    <div id="modalTitle" class="text-xl font-bold text-gray-800 font-jua mb-2">🎉 정답입니다!</div>
    
    <div id="modalContentBox" class="bg-amber-50 border-2 border-dashed border-amber-300 rounded-2xl p-4 my-3 text-sm font-bold text-amber-900 leading-relaxed">
      <!-- Dynamic Content -->
    </div>

    <div id="modalTimer" class="text-xs text-gray-500 font-bold">
      ⏱️ <span id="timerCount" class="text-red-500 font-bold">5</span>초 후 다음 단계로 이동합니다...
    </div>
  </div>
</div>

<script>
  let currentStep = 1;
  let unlockedStep = 1;

  // Step 2 Earned Hint for Step 3
  let step2EarnedHint = "💡 2단계에서 얻은 힌트: '잃어버린 양을 찾아 나서는 불쌍히 여기고 아끼는 하나님의 따뜻한 마음!'";

  // Quiz step dataset
  const stepData = {
    1: {
      title: "1단계: 예수님의 비유 속 이것은?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(4지 선다)</span><br>오늘 말씀에서 목자가 아흔아홉 마리를 들에 두고, 길을 잃어버려 끝까지 찾아다닌 동물은 무엇일까요?`,
      answers: ["잃은양", "양", "1", "①", "1번"],
      type: "mcq",
      options: ["① 잃은 양", "② 잃은 소", "③ 잃은 사슴", "④ 잃은 낙타"]
    },
    2: {
      title: "2단계: 하나님이 가장 기뻐하시는 이것은?",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(글자 선택)</span><br>오늘 말씀처럼, 죄인 한 사람이 잘못을 뉘우치고 하나님께 돌아오는 이 행동을 하나님께서 아흔아홉의 의인보다 더 기뻐하십니다!`,
      answers: ["회개"],
      type: "grid",
      letters: ["순", "회", "종", "믿", "개", "음", "찬", "양", "기", "도", "감", "사"]
    },
    3: {
      title: "3단계: 힌트를 활용해 문제를 풀어보세요!",
      hintHtml: `<span class="inline-block bg-amber-200 text-amber-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">(4지 선다)</span><br>2단계에서 얻은 힌트를 잘 생각해보세요! 회개하고 돌이키는 죄인을 조건 없이 감싸주시고 불쌍히 여겨주시는 하나님의 행동을 무엇이라 할까요?`,
      answers: ["불쌍히여김", "불쌍히 여김", "1", "①", "1번"],
      type: "mcq",
      options: ["① 불쌍히 여김", "② 벌을 내리심", "③ 외면하심", "④ 자랑하심"]
    },
    4: {
      title: "4단계 (최종): 하나님의 마음을 완성하세요!",
      hintHtml: `<span class="inline-block bg-yellow-200 text-yellow-900 font-bold px-2.5 py-0.5 rounded-md text-xs mb-1.5 font-jua">✨ 최종 주제 맞추기</span><br>아래 제시된 여러 글자 중에서, 잃어버린 우리를 불쌍히 여기시고 끝까지 사랑하시는 <strong>'하나님의 따뜻한 마음'</strong>을 뜻하는 두 글자를 찾아 완성하세요!`,
      answers: ["긍휼"],
      type: "grid",
      letters: ["사", "긍", "랑", "회", "자", "비", "휼", "개", "은", "혜", "기", "쁨"]
    }
  };

  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function renderMCQOptions(options) {
    const container = document.getElementById("mcqOptionsArea");
    container.innerHTML = "";
    options.forEach((optText) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-900 font-bold text-sm md:text-base py-2.5 px-2 rounded-xl font-jua transition-all";
      btn.innerText = optText;
      btn.onclick = () => {
        const cleanVal = optText.replace(/^[①②③④]\s*/, "");
        document.getElementById("answerInput").value = cleanVal;
      };
      container.appendChild(btn);
    });
  }

  function renderLetterGrid(letters, isFinal = false) {
    const gridContainer = document.getElementById("letterGrid");
    gridContainer.innerHTML = "";
    
    letters.forEach((char) => {
      const btn = document.createElement("button");
      if (isFinal) {
        btn.className = "letter-btn-final bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-900 font-bold text-lg py-2.5 rounded-xl font-jua";
      } else {
        btn.className = "letter-btn bg-blue-100 hover:bg-blue-200 border-2 border-blue-300 text-blue-900 font-bold text-lg py-2.5 rounded-xl font-jua";
      }
      btn.innerText = char;
      btn.onclick = () => appendLetter(char);
      gridContainer.appendChild(btn);
    });
  }

  function appendLetter(char) {
    const input = document.getElementById("answerInput");
    if (input) input.value += char;
  }

  function clearLetterInput() {
    const input = document.getElementById("answerInput");
    if (input) input.value = "";
  }

  // Bind to window for sandbox safety
  window.appendLetter = appendLetter;
  window.clearLetterInput = clearLetterInput;
  window.showStep = showStep;
  window.checkAnswer = checkAnswer;

  function showStep(step) {
    if (step > unlockedStep) return;

    currentStep = step;
    
    // Update step buttons visuals
    for (let i = 1; i <= 4; i++) {
      const btn = document.getElementById(`btn${i}`);
      if (i === step) {
        btn.className = "btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-blue-500 bg-blue-500 text-white shadow-md transition-all";
      } else if (i <= unlockedStep) {
        btn.className = "btn-step py-2 px-1 text-xs md:text-sm font-bold font-jua rounded-xl border-2 border-blue-400 bg-white text-blue-500 hover:bg-blue-50 transition-all";
      }
    }

    const data = stepData[step];
    document.getElementById("questionTitle").innerText = data.title;
    document.getElementById("questionHint").innerHTML = data.hintHtml;

    const mcqArea = document.getElementById("mcqOptionsArea");
    const gridArea = document.getElementById("letterGridArea");
    const answerSection = document.getElementById("answerSection");
    const unlockedHintCard = document.getElementById("unlockedHintCard");

    answerSection.classList.remove("hidden");

    // Display Step 2 earned hint during Step 3
    if (step === 3) {
      unlockedHintCard.innerText = step2EarnedHint;
      unlockedHintCard.classList.remove("hidden");
    } else {
      unlockedHintCard.classList.add("hidden");
    }

    if (data.type === "mcq") {
      mcqArea.classList.remove("hidden");
      gridArea.classList.add("hidden");
      renderMCQOptions(data.options);
    } else if (data.type === "grid") {
      mcqArea.classList.add("hidden");
      gridArea.classList.remove("hidden");
      renderLetterGrid(shuffleArray(data.letters), step === 4);
    }

    document.getElementById("answerInput").value = "";
    document.getElementById("resultMsg").innerText = "";
  }

  function checkAnswer() {
    const inputVal = document.getElementById("answerInput").value.trim().replace(/\s+/g, '');
    const resultMsg = document.getElementById("resultMsg");

    if (!inputVal) {
      resultMsg.innerText = "정답을 선택하거나 입력해주세요!";
      resultMsg.className = "min-h-[28px] text-center font-bold text-xs md:text-base text-red-500";
      return;
    }

    const validAnswers = stepData[currentStep].answers.map(a => a.replace(/\s+/g, ''));
    const isCorrect = validAnswers.includes(inputVal);

    if (isCorrect) {
      resultMsg.innerText = "";

      // Step 4 Final Success Message
      if (currentStep === 4) {
        document.getElementById("answerSection").classList.add("hidden");
        document.getElementById("letterGridArea").classList.add("hidden");
        document.getElementById("mcqOptionsArea").classList.add("hidden");
        
        resultMsg.innerHTML = `
          <div class="bg-amber-100 border-2 border-amber-400 rounded-2xl p-5 text-amber-950 font-bold text-base leading-relaxed modal-pop shadow-md text-center">
            🎉 정답입니다! (긍휼) <br><br>
            🤫 <span class="text-purple-800 text-base md:text-lg block mt-1">목장에서 가장 어린 목원이 사회자에게 귓속말로 정답을 알려주세요!</span>
          </div>
        `;
        return;
      }

      // Unlock next step
      if (currentStep === unlockedStep && unlockedStep < 4) {
        unlockedStep++;
        const nextBtn = document.getElementById(`btn${unlockedStep}`);
        nextBtn.disabled = false;
        if (unlockedStep === 4) {
          nextBtn.innerText = "4단계 (최종)";
        } else {
          nextBtn.innerText = `${unlockedStep}단계`;
        }
      }

      // Show reward/hint popup
      openRewardModal(currentStep);
    } else {
      resultMsg.innerText = "❌ 아쉽네요. 다시 생각해보세요!";
      resultMsg.className = "min-h-[28px] text-center font-bold text-xs md:text-base text-red-500";
    }
  }

  function openRewardModal(step) {
    const overlay = document.getElementById("modalOverlay");
    const contentBox = document.getElementById("modalContentBox");
    const timerCount = document.getElementById("timerCount");
    const modalTitle = document.getElementById("modalTitle");

    if (step === 1) {
      modalTitle.innerText = "🎉 1단계 통과!";
      contentBox.innerHTML = `양을 끝까지 찾아 헤매시는 목자의 마음을 느껴보세요!`;
    } else if (step === 2) {
      modalTitle.innerText = "🎉 2단계 정답! 힌트 획득!";
      contentBox.innerHTML = `<span class="text-blue-700 block mb-1">🎁 획득한 힌트 조각</span>"${step2EarnedHint}"`;
    } else if (step === 3) {
      modalTitle.innerText = "🎉 3단계 성공! 4단계 해금!";
      contentBox.innerHTML = `축하합니다! 4단계 최종 단계(🔒 해금)가 열렸습니다. 준비가 되었으면 4단계로 이동하세요!`;
    }

    overlay.classList.remove("hidden");
    overlay.classList.add("flex");

    let count = 5;
    timerCount.innerText = count;

    const timerInterval = setInterval(() => {
      count--;
      if (count > 0) {
        timerCount.innerText = count;
      } else {
        clearInterval(timerInterval);
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
        showStep(unlockedStep); // Move to unlocked step
      }
    }, 1000);
  }

  window.onload = function() {
    const clearBtn = document.getElementById("btnClearInput");
    if (clearBtn) {
      clearBtn.addEventListener("click", clearLetterInput);
    }
    showStep(1);
  };
</script>

</body>
</html>
