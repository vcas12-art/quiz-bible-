<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유초등2부 말씀 퀴즈 - 공통 낱말을 찾아라!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Nanum Gothic', sans-serif, Arial;
    }
    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .quiz-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 520px;
      text-align: center;
      position: relative;
    }
    h1 {
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .step-buttons {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 25px;
    }
    .btn-step {
      flex: 1;
      padding: 10px 4px;
      font-size: 14px;
      font-weight: bold;
      border: 2px solid #3498db;
      background-color: #ffffff;
      color: #3498db;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-step:hover:not(:disabled), .btn-step.active {
      background-color: #3498db;
      color: #ffffff;
    }
    .btn-step:disabled {
      border-color: #bdc3c7;
      background-color: #ecf0f1;
      color: #95a5a6;
      cursor: not-allowed;
    }
    .hint-box {
      background-color: #f9f9f9;
      border: 2px dashed #bdc3c7;
      border-radius: 15px;
      padding: 22px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .question-title {
      font-size: 20px;
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 14px;
    }
    .hint-content {
      font-size: 16px;
      color: #34495e;
      line-height: 1.6;
      word-break: keep-all;
    }
    .answer-section {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .answer-input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
    }
    .answer-input:focus {
      border-color: #2ecc71;
    }
    .btn-submit {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #27ae60;
    }
    .result-message {
      font-size: 18px;
      font-weight: bold;
      min-height: 30px;
      word-break: keep-all;
    }
    .correct { color: #27ae60; }
    .wrong { color: #e74c3c; }

    /* 모달 팝업 레이어 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 20px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
    }
    .modal-body {
      font-size: 18px;
      font-weight: bold;
      color: #27ae60;
      background: #e8f8f5;
      border: 2px dashed #2ecc71;
      padding: 20px;
      border-radius: 15px;
      line-height: 1.6;
      margin-bottom: 15px;
      word-break: keep-all;
    }
    .modal-timer {
      font-size: 15px;
      color: #7f8c8d;
      font-weight: bold;
    }

    /* 도전 버튼 스타일 */
    .btn-challenge {
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      background-color: #e67e22;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #d35400;
      transition: all 0.2s;
    }
    .btn-challenge:hover {
      background-color: #d35400;
      transform: translateY(2px);
      box-shadow: 0 3px 0 #d35400;
    }

    /* 마지막 단계 전용 스타일 */
    .countdown-text {
      font-size: 32px;
      font-weight: bold;
      color: #e74c3c;
      margin: 15px 0;
    }
    .all-sentences-container {
      text-align: left;
      background: #fdfefe;
      border: 2px solid #3498db;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .sentence-item {
      font-size: 15px;
      color: #2c3e50;
      padding: 10px 0;
      border-bottom: 1px dashed #ddd;
      font-weight: bold;
      line-height: 1.5;
    }
    .sentence-item:last-child {
      border-bottom: none;
    }
    .final-announce-box {
      background-color: #f3e5f5;
      border: 2px solid #8e44ad;
      border-radius: 12px;
      padding: 15px;
      color: #8e44ad;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.5;
      word-break: keep-all;
    }
  </style>
</head>
<body>

<div class="quiz-card">
  <h1>✨ 유초등2부 말씀 퀴즈 ✨</h1>
  
  <!-- 단계 버튼 -->
  <div class="step-buttons">
    <button id="btn1" class="btn-step active" onclick="showHint(1)">1단계</button>
    <button id="btn2" class="btn-step" onclick="showHint(2)" disabled>2단계 🔒</button>
    <button id="btn3" class="btn-step" onclick="showHint(3)" disabled>3단계 🔒</button>
    <button id="btn4" class="btn-step" onclick="startFinalStep()" disabled>마지막 단계 🔒</button>
  </div>

  <!-- 힌트 및 질문 영역 -->
  <div class="hint-box">
    <div id="question" class="question-title">1단계: 이 인물은 누구일까요?</div>
    <div id="hint" class="hint-content">
      갈대 상자에 담겨 나일강에 흘려보내졌으나 공주에게 구출되었고, 훗날 이스라엘 백성을 이집트에서 인도해낸 지도자입니다.
    </div>
  </div>

  <!-- 정답 입력 영역 (1~3단계) -->
  <div id="answerSection" class="answer-section">
    <input type="text" id="answerInput" class="answer-input" placeholder="정답을 입력하세요" onkeyup="if(window.event.keyCode==13){checkAnswer()}">
    <button class="btn-submit" onclick="checkAnswer()">제출</button>
  </div>

  <!-- 결과 영역 -->
  <div id="result" class="result-message"></div>
</div>

<!-- 팝업 모달 레이어 -->
<div id="modalOverlay" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div id="modalTitle" class="modal-title">🎉 정답입니다!</div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalTimer" class="modal-timer">5초 후 다음 단계로 이동합니다...</div>
    <button id="btnChallenge" class="btn-challenge" style="display: none;" onclick="onChallengeClick()">🔥 도전!</button>
  </div>
</div>

<script>
  let currentStep = 1;
  let unlockedStep = 1;

  // 각 단계별 문제 (2단계: 신체적 손, 3단계: 낱말 뜻 승리)
  const hints = {
    1: {
      question: "1단계: 이 인물은 누구일까요?",
      text: "갈대 상자에 담겨 나일강에 흘려보내졌으나 공주에게 구출되었고, 훗날 이스라엘 백성을 이집트에서 인도해낸 지도자입니다.",
      answer: "모세",
      rewardSentence: "💡 획득한 힌트 문장:<br><strong>'상자를 겹겹이 쌓은 뒤, 세 가닥의 줄로 단단히 고정했다'</strong>"
    },
    2: {
      question: "2단계: 이것은 우리 몸의 어디일까요?",
      text: "팔 끝에 붙어 있는 신체 부위로, 5개의 손가락이 있어서 물건을 집거나 악수를 할 때 사용하는 이것은 무엇일까요?",
      answer: "손",
      rewardSentence: "💡 획득한 힌트 문장:<br><strong>'줄을 세 번 감은 다음, 끝부분을 서로 겹쳐서 묶었다'</strong>"
    },
    3: {
      question: "3단계: 이 낱말은 무엇일까요?",
      text: "경기나 싸움, 또는 전쟁에서 상대방을 겨루어 이기는 것을 뜻하는 두 글자 낱말은 무엇일까요?",
      answer: "승리",
      rewardSentence: "💡 획득한 힌트 문장:<br><strong>'세 군데의 매듭을 겹쳐서 튼튼한 줄을 완성했다'</strong>"
    }
  };

  const finalSentences = [
    "1. 상자를 겹겹이 쌓은 뒤, 세 가닥의 줄로 단단히 고정했다",
    "2. 줄을 세 번 감은 다음, 끝부분을 서로 겹쳐서 묶었다",
    "3. 세 군데의 매듭을 겹쳐서 튼튼한 줄을 완성했다"
  ];

  function showHint(step) {
    if (step > unlockedStep || step === 4) return;

    currentStep = step;
    
    for (let i = 1; i <= 4; i++) {
      const btn = document.getElementById(`btn${i}`);
      if (i === step) btn.classList.add('active');
      else btn.classList.remove('active');
    }

    document.getElementById('question').innerText = hints[step].question;
    document.getElementById('hint').innerText = hints[step].text;
    document.getElementById('answerSection').style.display = "flex";
    document.getElementById('answerInput').value = "";
    document.getElementById('result').innerText = "";
  }

  function checkAnswer() {
    const userInput = document.getElementById('answerInput').value.trim().replace(/\s+/g, '');
    const resultDiv = document.getElementById('result');

    if (!userInput) {
      resultDiv.innerText = "정답을 입력해주세요!";
      resultDiv.className = "result-message wrong";
      return;
    }

    const stepAnswer = hints[currentStep].answer.replace(/\s+/g, '');

    if (userInput === stepAnswer) {
      resultDiv.innerText = "";
      
      // 다음 단계 해금
      if (currentStep === unlockedStep && unlockedStep < 4) {
        unlockedStep++;
        const nextBtn = document.getElementById(`btn${unlockedStep}`);
        nextBtn.disabled = false;
        if (unlockedStep === 4) {
          nextBtn.innerText = "마지막 단계";
        } else {
          nextBtn.innerText = `${unlockedStep}단계`;
        }
      }

      // 5초 대형 팝업 띄우기
      openRewardModal(currentStep);
    } else {
      resultDiv.innerText = "❌ 아쉽네요. 다시 생각해보세요!";
      resultDiv.className = "result-message wrong";
    }
  }

  // 획득 힌트 팝업 모달 함수
  function openRewardModal(step) {
    const modal = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalTimer = document.getElementById('modalTimer');
    const btnChallenge = document.getElementById('btnChallenge');

    modalTitle.innerText = `🎉 ${step}단계 정답입니다! (${hints[step].answer})`;
    modalBody.innerHTML = hints[step].rewardSentence;
    btnChallenge.style.display = "none";
    modalTimer.style.display = "block";

    modal.style.display = "flex";

    let timeLeft = 5;
    modalTimer.innerText = `${timeLeft}초 후 창이 닫힙니다...`;

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        modalTimer.innerText = `${timeLeft}초 후 창이 닫힙니다...`;
      } else {
        clearInterval(timer);
        
        // 3단계일 경우 마지막 도전 유도 팝업으로 전환
        if (step === 3) {
          showChallengeModal();
        } else {
          modal.style.display = "none";
          showHint(unlockedStep); // 다음 단계 문제 화면으로 이동
        }
      }
    }, 1000);
  }

  // 3단계 통과 후 "마지막 문제를 푸시겠습니까?" 팝업
  function showChallengeModal() {
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalTimer = document.getElementById('modalTimer');
    const btnChallenge = document.getElementById('btnChallenge');

    modalTitle.innerText = "🏆 모든 힌트를 얻었습니다!";
    modalBody.innerHTML = "<span style='color:#e67e22; font-size:20px;'>마지막 문제를 푸시겠습니까?</span><br><br>세 문장에 공통으로 들어간 낱말을 찾아보세요!";
    modalTimer.style.display = "none";
    btnChallenge.style.display = "inline-block";
  }

  // 도전 버튼 클릭 시
  function onChallengeClick() {
    document.getElementById('modalOverlay').style.display = "none";
    startFinalStep();
  }

  // 마지막 단계 진행 (5초 카운트다운 후 공개)
  function startFinalStep() {
    if (unlockedStep < 4) return;

    currentStep = 4;
    
    for (let i = 1; i <= 4; i++) {
      const btn = document.getElementById(`btn${i}`);
      if (i === 4) btn.classList.add('active');
      else btn.classList.remove('active');
    }

    document.getElementById('answerSection').style.display = "none";
    document.getElementById('question').innerText = "🔍 최종 미션: 공통 낱말 찾기";
    document.getElementById('hint').innerText = "잠시 후 세 개의 힌트 문장이 공개됩니다!";
    
    const resultDiv = document.getElementById('result');
    let count = 5;

    resultDiv.innerHTML = `<div class="countdown-text">⏱️ ${count}초 후 공개!</div>`;

    const timer = setInterval(() => {
      count--;
      if (count > 0) {
        resultDiv.innerHTML = `<div class="countdown-text">⏱️ ${count}초 후 공개!</div>`;
      } else {
        clearInterval(timer);
        showFinalContent();
      }
    }, 1000);
  }

  // 최종 문장 3개 및 발표 안내 표시
  function showFinalContent() {
    document.getElementById('hint').innerText = "아래 3개의 문장에서 공통으로 들어간 낱말을 찾아보세요!";

    const resultDiv = document.getElementById('result');
    
    let sentencesHTML = `<div class="all-sentences-container">`;
    finalSentences.forEach(s => {
      sentencesHTML += `<div class="sentence-item">${s}</div>`;
    });
    sentencesHTML += `</div>`;

    sentencesHTML += `<div class="final-announce-box">
      📢 세 개의 문장을 보고 공통으로 들어간 낱말을 찾아 정답을 말해보세요!<br>(✋ 손을 들어 발표)
    </div>`;

    resultDiv.innerHTML = sentencesHTML;
  }
</script>

</body>
</html>
